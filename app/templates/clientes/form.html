{% extends "base.html" %}

{% block title %}{{ "Editar" if editando else "Novo" }} Cliente — Adega Premium{% endblock %}

{% block content %}

<h1>{{ "Editar cliente" if editando else "Novo cliente" }}</h1>

{% if erro %} <p style="color:red">{{ erro }}</p>
{% endif %}

<form action="{{ '/clientes/' + editando.id|string + '/editar' if editando else '/clientes/novo' }}"
      method="post">

```
<label>Nome completo:
    <input
        type="text"
        name="nome"
        required
        autofocus
        placeholder="Digite o nome do cliente"
        value="{{ editando.nome if editando else (valores.nome if valores else '') }}">
</label>

<br><br>

<label>Telefone:
    <input
        type="text"
        name="telefone"
        placeholder="Ex: (11) 99999-9999"
        value="{{ editando.telefone if editando else (valores.telefone if valores else '') }}">
</label>

<br><br>

<label>CPF:
    <input
        type="text"
        name="cpf"
        placeholder="Ex: 000.000.000-00"
        value="{{ editando.cpf if editando else (valores.cpf if valores else '') }}">
</label>

<br><br>

<button type="submit">
    {{ "Salvar alterações" if editando else "Cadastrar cliente" }}
</button>

<a href="/clientes">Cancelar</a>
```

</form>

{% endblock %}
