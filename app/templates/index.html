{% extends "base.html" %}

{% block title %}AAPM - Sistema{% endblock %}

{% block styles %}

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    :root {
        --bg: #121212;
        --card: #1E1E1E;

        --primary: #FDE68A;
        --highlight: #FEF3C7;

        --text: #F9FAFB;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #121212, #000000);
        color: var(--text);
        overflow: hidden;
    }

    /* efeito futurista leve */
    body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: linear-gradient(
            45deg,
            transparent,
            rgba(253, 230, 138, 0.05),
            transparent
        );
        animation: move 10s linear infinite;
    }

    @keyframes move {
        0% {
            transform: translate(-25%, -25%) rotate(0deg);
        }

        100% {
            transform: translate(-25%, -25%) rotate(360deg);
        }
    }

    .card {
        position: relative;
        width: 420px;
        text-align: center;
        padding: 50px 40px;
        border-radius: 18px;

        background: var(--card);
        backdrop-filter: blur(12px);

        border: 1px solid rgba(253, 230, 138, 0.15);

        box-shadow:
            0 0 25px rgba(253, 230, 138, 0.08),
            0 0 60px rgba(0, 0, 0, 0.6);

        z-index: 1;
    }

    h1 {
        font-size: 34px;
        color: var(--primary);
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(253, 230, 138, 0.5);
    }
</style>

{% endblock %}

{% block content %}

{% endblock %}
